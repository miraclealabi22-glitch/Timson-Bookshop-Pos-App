<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimsonBookshop POS - Seller POS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Shared Admin CSS -->
    <link rel="stylesheet" href="../timson-pos-admin/admin.css">
    <!-- Specific System CSS -->
    <link rel="stylesheet" href="cashier.css">
    <style>
        .sidebar-menu-link { display: block; padding: 10px 15px; color: #fff; text-decoration: none; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.1); transition: all 0.3s;}
        .sidebar-menu-link:hover, .sidebar-menu-link.active { background-color: rgba(255,255,255,0.2); }
        .action-icon { width: 25px; text-align: center; margin-right: 10px; }
        
        /* Custom panel heights for responsive view */
        .catalog-panel-container { height: calc(100vh - 220px); overflow-y: auto; }
        .cart-panel-container { height: calc(100vh - 120px); }
        
        @media (max-width: 991.98px) {
            .catalog-panel-container { height: 400px; }
            .cart-panel-container { height: 600px; max-height: calc(100vh - 20px); }
            /* Order swap on mobile so cart is on top, but it's optional. Let's keep catalog first, but controlled height. */
        }
        
        .main-panel-header { background-color: #0f16bb; color: white; padding: 10px 15px; border-radius: 5px 5px 0 0; }
        .pos-panel { background: #fff; border: 1px solid #dee2e6; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        
        .catalog-item-row:hover { background-color: #f8f9fa; cursor: pointer; }
        .stock-badge { min-width: 80px; }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-book-open text-primary"></i> <span class="fs-5">TimsonBookshop</span></h3>
        </div>
        <ul class="list-unstyled components" id="navTabs">
            <li><a href="#" class="sidebar-menu-link active"><i class="fas fa-store action-icon"></i> Seller Point of Sale</a></li>
        </ul>
    </nav>

    <!-- Page Content -->
    <div id="content" class="content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light top-navbar">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-light d-lg-none shadow-sm">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="d-flex ms-auto align-items-center">
                    <div class="me-3 text-end d-none d-md-block">
                        <div id="clock" class="fw-bold fs-6">--:--:--</div>
                        <small id="date" class="text-muted">Loading date...</small>
                    </div>
                    
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center user-profile" href="#"
                            role="button" data-bs-toggle="dropdown">
                                <div class="rounded-circle me-2" id="profilePics" style="width: 36px; height: 36px; background-color: #e63946; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;">S</div>
                            <span id="userNameDisplay">Loading Seller...</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li><a id="logoutBtn" class="dropdown-item py-2 text-danger" href="#"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Dashboard Content -->
        <div class="container-fluid py-3 px-4">
            <div id="alertsContainer" class="position-absolute" style="top: 80px; right: 20px; z-index: 1050; width: 350px;"></div>

            <div class="row g-4 align-items-start">
                
                <!-- Left Catalog Panel -->
                <div class="col-lg-8">
                    <div class="pos-panel">
                        <div class="main-panel-header d-flex justify-content-between align-items-center mb-0">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-box-open me-2"></i> Product Catalog</h5>
                            <div class="d-flex gap-2">
                                <select id="sellerCategoryFilter" class="form-select form-select-sm border-0 shadow-sm" style="width: 150px;">
                                    <option value="all">All Categories</option>
                                </select>
                                <div class="input-group input-group-sm shadow-sm" style="width: 250px;">
                                    <span class="input-group-text bg-white border-0"><i class="fas fa-search text-muted"></i></span>
                                    <input type="text" id="sellerSearchInput" class="form-control border-0" placeholder="Search product...">
                                </div>
                            </div>
                        </div>
                        
                        <div class="table-responsive catalog-panel-container">
                            <table class="table table-hover align-middle mb-0 bg-white">
                                <thead style="position: sticky; top: 0; background: #fff; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                                    <tr>
                                        <th class="ps-3 border-0 py-3">Product Name</th>
                                        <th class="border-0 py-3">Category</th>
                                        <th class="border-0 py-3">Price (₦)</th>
                                        <th class="border-0 py-3">Stock</th>
                                        <th class="pe-3 border-0 py-3 text-end">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="catalogBody">
                                    <tr><td colspan="5" class="py-5 text-center text-muted"><i class="fas fa-spinner fa-spin me-2"></i> Loading catalog...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Right Cart Panel -->
                <div class="col-lg-4">
                    <div class="pos-panel d-flex flex-column cart-panel-container">
                        <div class="p-3 border-bottom bg-light">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div>
                                    <h5 class="fw-bold mb-0 text-dark"><i class="fas fa-shopping-basket text-primary me-2"></i> Current Order</h5>
                                    <small class="text-secondary fw-bold">Ref: <span id="sellerRefNo">---</span></small>
                                </div>
                                <span id="cartCountBadge" class="badge bg-primary rounded-pill px-3 py-2">0 Items</span>
                            </div>
                            
                            <!-- Customer Selection -->
                            <div>
                                <label class="form-label small fw-bold text-muted mb-1">Customer Name</label>
                                <input type="text" id="cartCustomerInput" class="form-control form-control-sm border-0 shadow-sm" placeholder="Walk-in Customer" list="customerDataList">
                                <datalist id="customerDataList"></datalist>
                                <small class="text-primary small mt-1 d-block" style="cursor: pointer;" onclick="document.getElementById('cartCustomerInput').value=''"><i class="fas fa-times-circle"></i> Clear customer</small>
                            </div>
                        </div>

                        <!-- Cart Items -->
                        <div class="flex-grow-1 p-3 bg-white" style="overflow-y: auto;">
                            <div id="emptyCartMsg" class="text-center py-5 text-muted">
                                <i class="fas fa-shopping-cart fa-3x mb-3 text-light"></i>
                                <h6>Cart is empty</h6>
                                <p class="small">Add items from the catalog.</p>
                            </div>
                            <div id="cartItemsList" class="d-flex flex-column gap-3"></div>
                        </div>

                        <!-- Cart Totals & Checkout -->
                        <div class="p-3 bg-light border-top mt-auto rounded-bottom">
                            <div class="d-flex justify-content-between mb-3">
                                <span class="fs-5 fw-bold text-dark">Total Due:</span>
                                <span class="fs-5 fw-bold text-primary" id="cartTotal">₦0.00</span>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button id="clearCartBtn" class="btn btn-outline-danger fw-bold shadow-sm" style="flex: 1;"><i class="fas fa-trash"></i></button>
                                <button id="submitOrderBtn" class="btn btn-primary fw-bold shadow-sm" style="flex: 4;" disabled>
                                    <i class="fas fa-paper-plane me-2"></i> Send to Cashier
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Add to Cart Modal -->
    <div class="modal fade" id="addToCartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white border-0 py-2">
                    <h6 class="modal-title fw-bold" id="modalProductName">Add Product</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-3">
                    <input type="hidden" id="modalProductId">
                    <div class="mb-2">
                        <label class="form-label small fw-bold mb-1 text-muted">Unit Type</label>
                        <select class="form-select form-select-sm" id="modalUnitType">
                            <option value="unit">Unit</option>
                            <option value="quarter">Quarter</option>
                            <option value="half">Half</option>
                            <option value="dozen">Dozen</option>
                            <option value="carton">Carton</option>
                        </select>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-4">
                            <label class="form-label small fw-bold mb-1 text-muted">Qty</label>
                            <input type="number" class="form-control form-control-sm" id="modalQty" value="1" min="1">
                        </div>
                        <div class="col-4">
                            <label class="form-label small fw-bold mb-1 text-muted">Disc (%)</label>
                            <input type="number" class="form-control form-control-sm text-danger fw-bold" id="modalDiscount" value="0" min="0" max="100">
                        </div>
                        <div class="col-4">
                            <label class="form-label small fw-bold mb-1 text-muted">Price (₦)</label>
                            <input type="text" class="form-control form-control-sm bg-light text-primary fw-bold" id="modalPrice" readonly>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 btn-sm fw-bold" onclick="confirmAddToCart()"><i class="fas fa-cart-plus me-1"></i> Add to Order</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="seller.js"></script>
    <script>
        const sidebarCollapseBtn = document.getElementById('sidebarCollapse');
        if (sidebarCollapseBtn) {
            sidebarCollapseBtn.addEventListener('click', function () {
                document.getElementById('sidebar').classList.toggle('active');
                document.getElementById('content').classList.toggle('active');
                document.body.classList.toggle('sidebar-open');
            });
        }
        
        // Add mobile overlay click listener
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98 && document.body.classList.contains('sidebar-open')) {
                const sidebar = document.getElementById('sidebar');
                if (!sidebar.contains(e.target) && e.target !== sidebarCollapseBtn && !sidebarCollapseBtn.contains(e.target)) {
                    document.getElementById('sidebar').classList.remove('active');
                    document.getElementById('content').classList.remove('active');
                    document.body.classList.remove('sidebar-open');
                }
            }
        });
    </script>
</body>
</html>
