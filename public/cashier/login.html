<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimsonBookshop POS - Login</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
            border-radius: 12px;
        }
        .btn-primary {
            background-color: #4361ee;
            border-color: #4361ee;
        }
        .btn-primary:hover {
            background-color: #3b55d9;
            border-color: #3b55d9;
        }
    </style>
</head>
<body>
    <div class="card border-0 shadow-sm login-card p-4 mx-3">
        <div class="text-center mb-4 mt-2">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                <i class="fas fa-book-open fs-3"></i>
            </div>
            <h4 class="fw-bold text-dark">TimsonBookshop POS</h4>
            <p class="text-muted">Cashier & Seller Portal</p>
        </div>
        
        <div id="loginAlert" class="alert alert-danger d-none py-2 fs-sm" role="alert">
            Invalid credentials.
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-medium text-dark small">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted border-end-0"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="emailInput" class="form-control border-start-0 ps-0" placeholder="cashier@timson.com" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-medium text-dark small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" id="passwordInput" class="form-control border-start-0 ps-0 border-end-0" placeholder="••••••••" required>
                    <button class="btn border border-start-0 bg-white text-muted" type="button" id="togglePasswordBtn"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            
            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-bold mb-3 shadow-sm text-uppercase">
                Log In
            </button>
        </form>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACgmBzV74SwJLVyUCMdN1xOxZjMI4UgCg",
            authDomain: "posapp-ed05a.firebaseapp.com",
            projectId: "posapp-ed05a",
            storageBucket: "posapp-ed05a.firebasestorage.app",
            messagingSenderId: "486175914054",
            appId: "1:486175914054:web:b2f7d71ae98c451f417247"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Toggle password vis
        document.getElementById('togglePasswordBtn').addEventListener('click', function() {
            const pwdInput = document.getElementById('passwordInput');
            const icon = this.querySelector('i');
            if(pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alert = document.getElementById('loginAlert');
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Logging in...`;
            alert.classList.add('d-none');

            // Hardcoded bypass for testing
            if (email === 'cashier@timson.com' && password === '12345678') {
                window.location.href = 'seller.html';
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'seller.html';
            } catch (error) {
                console.error(error);
                alert.textContent = error.message || 'Login failed. Please check your credentials.';
                alert.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = `Log In`;
            }
        });
    </script>
</body>
</html>
