<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimsonBookshop POS - Sign Up</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="../manifest.json">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --surface-color: #ffffff;
            --background-color: #f3f4f6;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Branding Section Styling */
        .branding-section {
            background: linear-gradient(135deg, #312e81 0%, #4f46e5 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem;
        }

        /* Ambient animated pattern background */
        .branding-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image:
                radial-gradient(circle at center, rgba(255, 255, 255, 0.06) 0, rgba(255, 255, 255, 0.06) 2px, transparent 2px);
            background-size: 40px 40px;
            animation: movePattern 40s linear infinite;
            z-index: 1;
        }

        .branding-section>* {
            z-index: 2;
            position: relative;
        }

        @keyframes movePattern {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-80px);
            }
        }

        /* Wrapper Styling */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--surface-color);
            padding: 2rem;
            overflow-y: auto;
        }

        .login-card {
            width: 100%;
            max-width: 520px; /* Slightly wider for signup fields */
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .login-card-header {
            margin-bottom: 2rem;
        }

        .login-card-header h2 {
            font-weight: 700;
            font-size: 1.875rem;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .login-card-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Form Controls */
        .form-label {
            font-weight: 500;
            font-size: 0.875rem;
            color: #374151;
            margin-bottom: 0.4rem;
        }

        .form-control, .form-select {
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            background-color: #f9fafb;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 0.75rem;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.025em;
            transition: all 0.2s ease;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-light {
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-light:hover {
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }

        /* Links */
        a.forgot-link {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a.forgot-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 991.98px) {
            .branding-section {
                padding: 3rem 2rem;
                min-height: 200px;
            }
        }

        @media (max-width: 575.98px) {
            .login-wrapper {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">

            <!-- Left Column: Branding -->
            <div class="col-lg-5 col-xl-6 branding-section text-white d-none d-lg-flex">
                <div class="bg-white p-4 rounded-4 mb-4 shadow-sm" style="display: inline-block;">
                    <img src="../logo.png" alt="Timson Bookshop" style="max-height: 120px;">
                </div>
                <h1 class="display-5 fw-bold mb-3 tracking-tight">TimsonBookshop POS</h1>
                <p class="fs-5 text-white-50 fw-light" style="max-width: 480px;">
                    Join the modern retail workspace. Set up your account and start managing your bookstore business today.
                </p>
            </div>

            <!-- Right Column: Sign Up Form -->
            <div class="col-12 col-lg-7 col-xl-6 login-wrapper">
                <div class="login-card">

                    <!-- Mobile Only Header -->
                    <div class="d-lg-none text-center mb-5 mt-3">
                        <img src="../logo.png" alt="Timson Bookshop" class="mb-3" style="max-height: 80px;">
                        <h1 class="h3 fw-bold text-dark mb-1">TimsonBookshop POS</h1>
                    </div>

                    <div class="login-card-header text-center text-lg-start">
                        <h2>Create Account</h2>
                        <p>Join the TimsonBookshop ecosystem to get started.</p>
                    </div>

                    <div id="alertContainer"></div>

                    <form id="signupForm" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
                            </div>

                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" placeholder="+1 (555) 000-0000" required>
                            </div>

                            <div class="col-md-6">
                                <label for="businessName" class="form-label">Business Name</label>
                                <input type="text" class="form-control" id="businessName" placeholder="My Bookshop" required>
                            </div>

                            <div class="col-12">
                                <label for="userRole" class="form-label">User Role</label>
                                <select class="form-select" id="userRole" required>
                                    <option value="" selected disabled>Choose a role...</option>
                                    <option value="admin">Admin</option>
                                    <option value="cashier">Cashier</option>
                                    <option value="seller">Seller</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="8">
                            </div>

                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" id="createBtn" class="btn btn-primary w-100 d-flex justify-content-center align-items-center gap-2">
                                <span id="btnText">Prepare Workspace</span>
                                <div id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </button>

                            <button type="button" id="googleBtn" onclick="signG()" class="btn btn-light w-100 mt-3 d-flex justify-content-center align-items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                                    <path fill="#ffc107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917"/>
                                    <path fill="#ff3d00" d="m6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691"/>
                                    <path fill="#4caf50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.9 11.9 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44"/>
                                    <path fill="#1976d2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917"/>
                                </svg>
                                <span>Continue with Google</span>
                            </button>
                        </div>

                        <div class="mt-4 text-center">
                            <span class="text-secondary small">Already have an account? </span>
                            <a href="../timson-pos-login/index.html" class="forgot-link small">Sign in</a>
                        </div>
                    </form>

                    <div class="mt-5 text-center text-lg-start">
                        <p class="text-secondary small mb-0">&copy; 2026 TimsonBookshop POS. All rights reserved.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACgmBzV74SwJLVyUCMdN1xOxZjMI4UgCg",
            authDomain: "posapp-ed05a.firebaseapp.com",
            projectId: "posapp-ed05a",
            storageBucket: "posapp-ed05a.firebasestorage.app",
            messagingSenderId: "486175914054",
            appId: "1:486175914054:web:b2f7d71ae98c451f417247"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const signG = () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    setTimeout(() => {
                        window.location.href = '../timson-pos-admin/admin-dashboard.html';
                    }, 1000)
                })
                .catch((error) => {
                    console.error(error);
                })
        }
        window.signG = signG;
    </script>
</body>

</html>
