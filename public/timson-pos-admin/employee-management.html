<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimsonBookshop POS - Employee Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Luxury AI Bot Fonts & CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="luxury-bot.css">
</head>

<body>

    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header text-center py-4">
            <div class="sidebar-logo-box">
                <img src="../logo.png" alt="Timson Bookshop" class="sidebar-logo-img">
            </div>
        </div>
        <ul class="list-unstyled components">
            <li><a href="admin-dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="inventory-management.html"><i class="fas fa-boxes"></i> Inventory</a></li>
            <li><a href="stock-control.html"><i class="fas fa-clipboard-check"></i> Stock Control</a></li>
            <li><a href="import/import-finalizer.html"><i class="fas fa-calculator"></i> Import Finalizer</a></li>
            <li><a href="sales-reports.html"><i class="fas fa-file-invoice-dollar"></i> Sales Reports</a></li>
            <li><a href="customer-credit.html"><i class="fas fa-credit-card"></i> Customer Credit</a></li>
            <li class="active"><a href="employee-management.html"><i class="fas fa-users"></i> Employees</a></li>
            <li><a href="#" id="luxuryAiTab" onclick="window.toggleLuxuryBot(); return false;"><i class="fas fa-robot text-warning"></i> AI Assistant</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-pie"></i> Analytics</a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </nav>

    <!-- Page Content -->
    <div id="content" class="content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light top-navbar">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-light d-lg-none shadow-sm">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="d-flex ms-auto align-items-center">
                    <div class="dropdown me-3 dropdown-notification">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-bell"></i>
                            <span class="badge bg-danger">0</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li>
                                <h6 class="dropdown-header">Notifications</h6>
                            </li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center user-profile" href="#"
                            role="button" data-bs-toggle="dropdown">
                            <div class="rounded-circle me-2" id="profilePics"></div>
                            <span>Admin</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li><a class="dropdown-item py-2" href="#"><i
                                        class="fas fa-user-circle me-2 text-muted"></i> Profile</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a id="logoutBtn" class="dropdown-item py-2 text-danger" href="#"><i
                                        class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container-fluid py-4 px-4">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <h3 class="fw-bold text-dark mb-0">Employee Management</h3>
            </div>
            <!-- Current user panel -->
            <div class="row mb-4">
                <div class="col-12">
                    <div id="userPanel" class="card border-0 shadow-sm">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div id="panelPic" class="rounded-circle overflow-hidden" style="width:48px;height:48px;"></div>
                            <div>
                                <h5 id="panelName" class="mb-0 fw-bold">User</h5>
                                <small id="panelEmail" class="text-muted"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- employee list and controls -->
            <div class="mb-3">
                <button id="addEmployeeBtn" class="btn btn-primary"><i class="fas fa-user-plus me-2"></i>Add Employee</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover" id="employeeTable">
                    <thead class="table-light">
                        <tr><th>ID</th><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <!-- simple modal -->
            <div class="modal fade" id="employeeModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Add Employee</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form id="employeeForm">
                                <div class="mb-3">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" id="empName" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Username (For Login)</label>
                                    <input type="text" class="form-control" id="empUsername" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email Address (Optional)</label>
                                    <input type="email" class="form-control" id="empEmail">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Temporary Password</label>
                                    <input type="password" class="form-control" id="empPassword" required minlength="6">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Role</label>
                                    <select class="form-select" id="empRole">
                                        <option value="Admin">Admin</option>
                                        <option value="Cashier">Cashier</option>
                                        <option value="Seller">Seller</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Status</label>
                                    <select class="form-select" id="empStatus">
                                        <option value="Active" selected>Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </div>
                                <div id="empModalError" class="text-danger small mb-2 d-none"></div>
                                <button type="submit" id="empSubmitBtn" class="btn btn-primary d-flex align-items-center justify-content-center w-100">
                                    <span>Create Account</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
    <script type="module" src="employee-management.js"></script>
    <!-- Luxury AI Bot JS -->
    <script src="luxury-bot.js"></script>
</body>

</html>
