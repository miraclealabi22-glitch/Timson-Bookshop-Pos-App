<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimsonBookshop POS - Sales Reports</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-book-open text-primary"></i> <span class="fs-5">TimsonBookshop</span></h3>
        </div>
        <ul class="list-unstyled components">
            <li><a href="admin-dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="inventory-management.html"><i class="fas fa-boxes"></i> Inventory</a></li>
            <li><a href="stock-control.html"><i class="fas fa-clipboard-check"></i> Stock Control</a></li>
            <li class="active"><a href="sales-reports.html"><i class="fas fa-file-invoice-dollar"></i> Sales Reports</a></li>
            <li><a href="customer-credit.html"><i class="fas fa-credit-card"></i> Customer Credit</a></li>
            <li><a href="employee-management.html"><i class="fas fa-users"></i> Employees</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-pie"></i> Analytics</a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </nav>

    <!-- Page Content -->
    <div id="content" class="content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light top-navbar">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-light d-lg-none shadow-sm">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="d-flex ms-auto align-items-center">
                    <div class="dropdown me-3 dropdown-notification">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-bell"></i>
                            <span class="badge bg-danger">0</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li>
                                <h6 class="dropdown-header">Notifications</h6>
                            </li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center user-profile" href="#"
                            role="button" data-bs-toggle="dropdown">
                            <div class="rounded-circle me-2" id="profilePics"></div>
                            <span>Admin</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li><a class="dropdown-item py-2" href="#"><i
                                        class="fas fa-user-circle me-2 text-muted"></i> Profile</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a id="logoutBtn" class="dropdown-item py-2 text-danger" href="#"><i
                                        class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container-fluid py-4 px-4">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <h3 class="fw-bold text-dark mb-0">Sales Reports</h3>
            </div>
            <!-- Current user panel -->
            <div class="row mb-4">
                <div class="col-12">
                    <div id="userPanel" class="card border-0 shadow-sm">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div id="panelPic" class="rounded-circle overflow-hidden" style="width:48px;height:48px;"></div>
                            <div>
                                <h5 id="panelName" class="mb-0 fw-bold">User</h5>
                                <small id="panelEmail" class="text-muted"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- sales reports controls -->
            <div class="mb-4 d-flex gap-2 align-items-center flex-wrap">
                <select id="reportRange" class="form-select w-auto border-0 shadow-sm">
                    <option value="7days">Last 7 days</option>
                    <option value="30days" selected>Last 30 days</option>
                    <option value="90days">Last 90 days</option>
                    <option value="year">Last year</option>
                </select>
                <button id="exportReportBtn" class="btn btn-primary">Export</button>
            </div>
            <div style="height:300px;" class="mb-5">
                <canvas id="salesReportsChart"></canvas>
            </div>
            <div id="reportTableContainer"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="admin.js"></script>
    <script src="sales-reports.js"></script>
</body>

</html>
