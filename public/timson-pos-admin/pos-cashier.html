<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bookstore POS - Seller/Cashier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; min-height: 100vh; }
    .badge-stock { font-size: .75rem; }
    .panel-card { min-height: 80vh; }
    .table-sm { font-size: .85rem; }
    .out-of-stock { color: #d63384; font-weight: 600; }
    .low-stock { color: #fd7e14; font-weight: 600; }
    .in-stock { color: #198754; font-weight: 600; }
    .pointer { cursor: pointer; }
    #clock { font-weight: 600; }
    .cart-empty { color: #6c757d; }
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 2000; }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="https://img.icons8.com/ios-filled/32/ffffff/book.png" width="28" class="me-2"> Bookstore POS
      </a>
      <div class="d-flex text-white align-items-center">
        <div class="me-4 text-end">
          <div id="clock">--:--:--</div>
          <small id="date">Loading date...</small>
        </div>
        <button id="btnLogout" class="btn btn-outline-light btn-sm me-3">Logout</button>
        <div class="dropdown">
          <button class="btn btn-secondary dropdown-toggle btn-sm" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i> <span id="sellerName">Cashier</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Profile</a></li>
            <li><a class="dropdown-item" href="#">Notifications</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-3">
    <div class="row g-3">
      <div class="col-md-7 col-lg-7">
        <div class="card panel-card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Products</h5>
            <small class="text-muted">Stock: <span id="productCount">0</span></small>
          </div>
          <div class="card-body">
            <div class="row g-2 mb-2">
              <div class="col-sm-5"><input id="searchProductInput" class="form-control form-control-sm" placeholder="Search product name"></div>
              <div class="col-sm-4"><select id="categoryFilterInput" class="form-select form-select-sm"><option value="all">All Categories</option></select></div>
              <div class="col-sm-3 text-end"><span class="badge bg-info">Realtime</span></div>
            </div>
            <div class="table-responsive" style="max-height: 62vh; overflow-y: auto;">
              <table class="table table-bordered table-sm table-hover align-middle">
                <thead class="table-light sticky-top"><tr><th>Book</th><th>Category</th><th>Cost</th><th>Selling</th><th>Qty</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="productTableBody"></tbody>
              </table>
            </div>
            <nav><ul class="pagination pagination-sm justify-content-center" id="pagination"></ul></nav>
          </div>
        </div>
      </div>

      <div class="col-md-5 col-lg-5">
        <div class="card panel-card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center"><h5 class="mb-0">Cart</h5><span class="badge bg-primary" id="cartItemCount">0 items</span></div>
          <div class="card-body">
            <div class="table-responsive" style="max-height: 46vh; overflow-y: auto;"><table class="table table-sm table-bordered align-middle"><thead class="table-light"><tr><th>Book</th><th>Qty</th><th>Price</th><th>Subtotal</th><th></th></tr></thead><tbody id="cartTableBody"><tr class="cart-empty"><td colspan="5" class="text-center">Cart is empty</td></tr></tbody></table></div>
            <div class="row g-2 align-items-center mb-2"><div class="col-9"><input id="customerNameInput" class="form-control form-control-sm" placeholder="Customer name (optional)"></div><div class="col-3"><button id="clearCartBtn" class="btn btn-outline-secondary btn-sm w-100">Clear</button></div></div>
            <div class="mb-2"><div class="d-flex justify-content-between"><span>Total:</span><strong id="cartTotal">₦0.00</strong></div><div class="d-flex justify-content-between"><span>Discount (%)</span><input id="discountInput" class="form-control form-control-sm w-50" type="number" min="0" max="100" value="0"></div></div>
            <div class="d-grid gap-2"><button id="btnApplyDiscount" class="btn btn-warning btn-sm">Apply Discount</button><button id="btnCheckout" class="btn btn-success">Checkout</button><button id="btnPrintReceipt" class="btn btn-outline-primary">Print Receipt</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update, push } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACgmBzV74SwJLVyUCMdN1xOxZjMI4UgCg",
      authDomain: "posapp-ed05a.firebaseapp.com",
      databaseURL: "https://posapp-ed05a-default-rtdb.firebaseio.com",
      projectId: "posapp-ed05a",
      storageBucket: "posapp-ed05a.firebasestorage.app",
      messagingSenderId: "486175914054",
      appId: "1:486175914054:web:b2f7d71ae98c451f417247"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const stockRef = ref(db, "stockRef");
    const salesRef = ref(db, "salesRef");
    const sellerName = "Cashier John";
    document.getElementById("sellerName").innerText = sellerName;

    let products = [], filteredProducts = [], cart = [];
    const PAGE_SIZE = 20; let currentPage = 1;

    const selectors = {
      productTableBody: document.getElementById("productTableBody"),
      categoryFilterInput: document.getElementById("categoryFilterInput"),
      searchProductInput: document.getElementById("searchProductInput"),
      productCount: document.getElementById("productCount"),
      pagination: document.getElementById("pagination"),
      cartTableBody: document.getElementById("cartTableBody"),
      cartItemCount: document.getElementById("cartItemCount"),
      cartTotal: document.getElementById("cartTotal"),
      discountInput: document.getElementById("discountInput"),
      customerNameInput: document.getElementById("customerNameInput"),
      clearCartBtn: document.getElementById("clearCartBtn"),
      btnApplyDiscount: document.getElementById("btnApplyDiscount"),
      btnCheckout: document.getElementById("btnCheckout"),
      btnPrintReceipt: document.getElementById("btnPrintReceipt")
    };

    function showToast(message, type = "success") {
      const t = document.createElement("div");
      t.className = `toast align-items-center text-bg-${type} border-0`;
      t.role = "alert"; t.ariaLive = "assertive"; t.ariaAtomic = "true";
      t.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
      document.getElementById("toastContainer").appendChild(t);
      const bsToast = new bootstrap.Toast(t, { delay: 2200 });
      bsToast.show();
      t.addEventListener("hidden.bs.toast", () => t.remove());
    }

    function stockStatus(q) {
      if (q <= 0) return `<span class="badge bg-danger badge-stock">Out of stock</span>`;
      if (q <= 5) return `<span class="badge bg-warning text-dark badge-stock">Low stock</span>`;
      return `<span class="badge bg-success badge-stock">In stock</span>`;
    }

    function renderProducts() {
      const start = (currentPage - 1) * PAGE_SIZE;
      const slice = filteredProducts.slice(start, start + PAGE_SIZE);
      selectors.productTableBody.innerHTML = "";
      if (!slice.length) selectors.productTableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No products found.</td></tr>`;
      slice.forEach(p => {
        const btnDisabled = p.StockQuantity <= 0 ? "disabled" : "";
        const row = document.createElement("tr");
        row.innerHTML = `<td>${p.Product}</td><td>${p.ProductCategory}</td><td>₦${Number(p.CostPrice).toFixed(2)}</td><td>₦${Number(p.SellingPrice).toFixed(2)}</td><td>${p.StockQuantity}</td><td>${stockStatus(p.StockQuantity)}</td><td><button class="btn btn-sm btn-primary" ${btnDisabled} data-id="${p.id}">Add to cart</button></td>`;
        selectors.productTableBody.appendChild(row);
      });
      selectors.productCount.innerText = filteredProducts.length;
      renderPagination();
    }

    function renderPagination() {
      selectors.pagination.innerHTML = "";
      const total = Math.ceil(filteredProducts.length / PAGE_SIZE) || 1;
      for (let i=1; i<=total; i++) {
        const li = document.createElement("li");
        li.className = `page-item ${i===currentPage ? "active" : ""}`;
        li.innerHTML = `<a class="page-link">${i}</a>`;
        li.addEventListener("click", () => { currentPage=i; renderProducts(); });
        selectors.pagination.appendChild(li);
      }
    }

    function renderCart() {
      if (!cart.length) {
        selectors.cartTableBody.innerHTML = '<tr><td colspan="5" class="text-center cart-empty">Cart is empty</td></tr>';
        selectors.cartItemCount.innerText = '0 items';
        selectors.cartTotal.innerText = '₦0.00';
        return;
      }
      selectors.cartTableBody.innerHTML = '';
      let total=0;
      cart.forEach(item => {
        const subtotal = item.quantity * Number(item.SellingPrice);
        total += subtotal;
        const row = document.createElement('tr');
        row.innerHTML = `<td>${item.Product}</td><td><input class="form-control form-control-sm quantity-input" data-id="${item.id}" type="number" min="1" max="${item.StockQuantity}" value="${item.quantity}"></td><td>₦${Number(item.SellingPrice).toFixed(2)}</td><td>₦${subtotal.toFixed(2)}</td><td><button class="btn btn-sm btn-outline-danger remove-item" data-id="${item.id}">&times;</button></td>`;
        selectors.cartTableBody.appendChild(row);
      });
      selectors.cartItemCount.innerText = `${cart.length} items`;
      const discount = Number(selectors.discountInput.value || 0);
      const finalTotal = discount ? total * ((100-discount)/100) : total;
      selectors.cartTotal.innerText = `₦${finalTotal.toFixed(2)}`;
    }

    function setCategoryOptions() {
      const categories = Array.from(new Set(products.map(p=>p.ProductCategory)));
      selectors.categoryFilterInput.innerHTML = '<option value="all">All Categories</option>' + categories.map(cat=>`<option value="${cat}">${cat}</option>`).join('');
    }

    function refreshFilter() {
      const search = selectors.searchProductInput.value.trim().toLowerCase();
      const category = selectors.categoryFilterInput.value;
      filteredProducts = products.filter(p =>
        (!search || p.Product.toLowerCase().includes(search)) &&
        (category === 'all' || p.ProductCategory === category)
      );
      currentPage =1;
      renderProducts();
    }

    function addToCart(productId) {
      const product = products.find(p => p.id===productId);
      if (!product) return;
      if (product.StockQuantity<=0) { showToast('Out of stock', 'danger'); return; }
      const existing = cart.find(c=>c.id===productId);
      if (existing) {
        if (existing.quantity +1 > product.StockQuantity) { showToast('Not enough stock', 'warning'); return; }
        existing.quantity +=1;
      } else {
        cart.push({...product, quantity:1});
      }
      showToast('Added to cart','success');
      if (product.StockQuantity <=5) showToast('Low stock alert','warning');
      renderCart();
    }

    function removeFromCart(productId) { cart = cart.filter(item=>item.id!==productId); renderCart(); }
    function clearCart() { if(!cart.length) return; if (!confirm('Clear cart?')) return; cart=[]; renderCart(); }
    function checkoutCart() {
      if(!cart.length){showToast('Cart empty','warning'); return;}
      const total = cart.reduce((s,item)=>s + item.quantity*Number(item.SellingPrice),0);
      const discount = Number(selectors.discountInput.value||0);
      const final = total * ((100-discount)/100);
      if(!confirm(`Pay ₦${final.toFixed(2)}?`)) return;
      const sale = { seller: sellerName, customer: selectors.customerNameInput.value||'Walk-in', total: Number(final.toFixed(2)), discount, timestamp:new Date().toISOString(), items: cart.map(i=>({id:i.id,Product:i.Product,quantity:i.quantity,price:Number(i.SellingPrice),subtotal:Number((i.quantity*Number(i.SellingPrice)).toFixed(2))})) };
      const newSale = push(salesRef);
      set(newSale, sale).then(()=>{
        cart.forEach(i=>{
          const productRef = ref(db, `stockRef/${i.id}`);
          update(productRef, {StockQuantity: Math.max(0, Number(i.StockQuantity)-i.quantity)});
        });
        showToast('Sale complete','success');
        cart=[]; renderCart();
      }).catch(e=>{showToast('Checkout error','danger'); console.error(e);});
    }

    function printReceipt(){ if(!cart.length){showToast('No items','warning'); return;} const w=window.open('','_blank','width=600,height=700'); w.document.write('<h3>Receipt</h3><p>'+new Date().toLocaleString()+'</p>'); w.document.write('<table border="1" cellpadding="6" style="width:100%;border-collapse:collapse;"><tr><th>Book</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr>'); cart.forEach(i=>w.document.write(`<tr><td>${i.Product}</td><td>${i.quantity}</td><td>₦${i.SellingPrice}</td><td>₦${(i.quantity*Number(i.SellingPrice)).toFixed(2)}</td></tr>`)); w.document.write('</table>'); w.document.close(); w.print(); w.close(); }

    function initClock(){ setInterval(()=>{ const n=new Date(); document.getElementById('clock').innerText = n.toLocaleTimeString(); document.getElementById('date').innerText = n.toLocaleDateString(); },1000); }

    function subscribeStock(){ onValue(stockRef,snapshot=>{ const data=snapshot.val()||{}; products=Object.entries(data).map(([key,v])=>({id:key, ...v})); setCategoryOptions(); refreshFilter(); }); }

    function init() {
      initClock(); subscribeStock();
      selectors.searchProductInput.addEventListener('input', refreshFilter);
      selectors.categoryFilterInput.addEventListener('change', refreshFilter);
      selectors.clearCartBtn.addEventListener('click', clearCart);
      selectors.btnApplyDiscount.addEventListener('click', renderCart);
      selectors.btnCheckout.addEventListener('click', checkoutCart);
      selectors.btnPrintReceipt.addEventListener('click', printReceipt);
      selectors.productTableBody.addEventListener('click', e=>{ if(e.target.tagName==='BUTTON') addToCart(e.target.dataset.id); });
      selectors.cartTableBody.addEventListener('input', e=>{ if(e.target.classList.contains('quantity-input')){ const id=e.target.dataset.id; const q=Math.max(1, Number(e.target.value)); const item=cart.find(c=>c.id===id); if(item){ item.quantity = Math.min(q, Number(item.StockQuantity)); renderCart(); }} });
      selectors.cartTableBody.addEventListener('click', e=>{ if(e.target.classList.contains('remove-item')) removeFromCart(e.target.dataset.id); });
      document.getElementById('btnLogout').addEventListener('click', ()=>{ alert('Logged out'); window.location.href='admin-dashboard.html'; });
    }

    init();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
